<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>encode</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #e8e8e8;
  }

  /* ================= background ================= */
  #sky {
    position: fixed;
    inset: 0;
    display: block;
    z-index: 1;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 42%,
      rgba(0,0,0,0) 32%,
      rgba(0,0,0,.7) 100%
    );
  }

  /* ================= layout ================= */
  .scroll-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #1c1c1c transparent;
  }
  .scroll-layer::-webkit-scrollbar { width: 7px; }
  .scroll-layer::-webkit-scrollbar-track { background: transparent; }
  .scroll-layer::-webkit-scrollbar-thumb {
    background: #1c1c1c;
    border-radius: 8px;
  }

  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem 2.75rem;
    gap: 1.75rem;
  }

  /* ================= hero ================= */
  .hero {
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .title {
    font-family: 'Great Vibes', 'Cormorant Garamond', cursive;
    font-weight: 400;
    font-size: clamp(3.5rem, 14vw, 9rem);
    line-height: 1;
    letter-spacing: 0.01em;

    /* white → pink gradient filling the letters */
    background-image: linear-gradient(
      100deg,
      #ffffff 0%,
      #ffffff 30%,
      #ffd0e4 46%,
      #ff8fc4 58%,
      #ffb8d9 70%,
      #ffffff 100%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;

    animation: sheen 8s ease-in-out infinite;

    /* white-pink glow radiating outward */
    filter:
      drop-shadow(0 0 6px rgba(255, 255, 255, .55))
      drop-shadow(0 0 14px rgba(255, 138, 200, .65))
      drop-shadow(0 0 30px rgba(255, 92, 176, .45))
      drop-shadow(0 0 60px rgba(255, 60, 160, .25));
  }

  @keyframes sheen {
    0%   { background-position:   0% 50%; }
    50%  { background-position: 125% 50%; }
    100% { background-position: 250% 50%; }
  }

  .sub {
    margin-top: -0.35rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(.72rem, 1.3vw, .88rem);
    letter-spacing: .62em;
    text-indent: .62em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .42);
  }

  /* ================= menu ================= */
  .menu {
    width: min(540px, 100%);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-item {
    border-radius: 14px;
    background: rgba(255,255,255,.028);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
    transition: border-color .3s ease, background .3s ease, box-shadow .3s ease;
  }
  .menu-item:hover {
    border-color: rgba(255, 200, 225, .22);
    background: rgba(255,255,255,.045);
  }
  .menu-item.open {
    border-color: rgba(255, 190, 220, .32);
    background: rgba(255,255,255,.05);
    box-shadow:
      0 20px 55px -30px rgba(0,0,0,.95),
      0 0 24px -8px rgba(255, 110, 180, .35);
  }

  .menu-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: transparent;
    border: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }

  .menu-header .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255, 138, 200, .9);
    animation: pulse 2.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: .45; transform: scale(.82); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  .menu-name {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: .01em;
    color: #f5f5f5;
  }

  .chev {
    display: inline-flex;
    color: rgba(255,255,255,.4);
    transition: transform .4s cubic-bezier(.4,0,.2,1), color .3s ease;
    flex-shrink: 0;
  }
  .menu-item.open .chev {
    transform: rotate(180deg);
    color: #ffb8d9;
  }

  /* expand animation */
  .menu-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.4,0,.2,1);
  }
  .menu-item.open .menu-panel {
    grid-template-rows: 1fr;
  }
  .menu-panel-inner {
    overflow: hidden;
    min-height: 0;
  }

  /* ================= code block ================= */
  .code-wrap {
    margin: 0 10px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.07);
    background: #0a0a0a;
    overflow: hidden;
  }

  .code-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    background: rgba(255,255,255,.02);
  }

  .lang {
    font-family: 'JetBrains Mono', monospace;
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.3);
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.78);
    font-family: 'Inter', sans-serif;
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn:hover {
    background: rgba(255, 138, 200, .16);
    color: #fff;
    border-color: rgba(255, 138, 200, .4);
  }
  .copy-btn.copied {
    color: #0a0a0a;
    background: #ffb8d9;
    border-color: #ffb8d9;
  }
  .copy-btn svg { display: block; }

  /* code area */
  .code-area {
    position: relative;
    min-height: 40px;
  }

  .code-pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 11px 13px;
    color: #ededed;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }
  .code-pre .fn   { color: #ffffff; font-weight: 500; }
  .code-pre .str  { color: #ffb8d9; }
  .code-pre .punc { color: #5f5f5f; }

  /* Monaco container */
  .editor {
    height: 40px;
    width: 100%;
    display: none;
  }
  .code-area.monaco .editor     { display: block; }
  .code-area.monaco .code-pre   { display: none; }

  @media (max-width: 520px) {
    .stage { padding: 2rem 1rem 2.25rem; gap: 1.4rem; }
    .menu-header { padding: 10px 12px; }
    .menu-name { font-size: .95rem; }
    .code-wrap { margin: 0 8px 8px; }
    .code-pre { font-size: 11.5px; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="vignette"></div>

<div class="scroll-layer">
  <div class="stage">

    <header class="hero">
      <h1 class="title">encode</h1>
      <p class="sub">Scripts</p>
    </header>

    <div class="menu">

      <!-- =========== AntiVC =========== -->
      <div class="menu-item" data-script="antivc">
        <button class="menu-header" type="button" aria-expanded="false">
          <span class="dot" aria-hidden="true"></span>
          <span class="menu-name">AntiVC Script</span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </button>

        <div class="menu-panel">
          <div class="menu-panel-inner">
            <div class="code-wrap">
              <div class="code-top">
                <span class="lang">lua</span>
                <button class="copy-btn" type="button" data-copy="antivc">
                  <svg viewBox="0 0 24 24" width="10" height="10" fill="none"
                       stroke="currentColor" stroke-width="2.2"
                       stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2.5"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  <span class="copy-label">Copy</span>
                </button>
              </div>

              <div class="code-area" id="area-antivc">
                <div class="editor" id="editor-antivc"></div>
                <pre class="code-pre">loadstring<span class="punc">(</span>game<span class="punc">:</span>HttpGet<span class="punc">(</span><span class="str">"https://encode.lol/antivc.lua"</span><span class="punc">))()</span></pre>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- add more items here with unique data-script keys -->

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

<script>
/* =========================================================
   SCRIPTS — exact strings used for the copy button
   ========================================================= */
const SCRIPTS = {
  antivc: 'loadstring(game:HttpGet("https://encode.lol/antivc.lua"))()'
};

/* =========================================================
   SHOOTING STAR SKY
   ========================================================= */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
let stars = [];
const shooters = [];
let nextSpawn = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}

function buildStars() {
  const target = Math.min(Math.round((W * H) / 8200), 320);
  stars = Array.from({ length: target }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.1 + 0.3,
    base: Math.random() * 0.40 + 0.12,
    amp: Math.random() * 0.38,
    phase: Math.random() * Math.PI * 2,
    spd: 0.5 + Math.random() * 1.8
  }));
}

function spawnShooter() {
  const dir   = Math.random() < 0.5 ? 1 : -1;
  const angle = (16 + Math.random() * 32) * Math.PI / 180;
  const speed = 7 + Math.random() * 9;

  const vx = Math.cos(angle) * speed * dir;
  const vy = Math.sin(angle) * speed;

  const startY = -60 + Math.random() * H * 0.6;
  const startX = dir === 1
    ? -140 - Math.random() * 260
    :  W + 140 + Math.random() * 260;

  shooters.push({
    x: startX,
    y: startY,
    vx, vy,
    len: 130 + Math.random() * 280,
    width: 0.9 + Math.random() * 1.7,
    life: 0,
    maxLife: 80 + Math.random() * 80
  });
}

function drawShooter(s) {
  const mag = Math.hypot(s.vx, s.vy) || 1;
  const ux = s.vx / mag;
  const uy = s.vy / mag;

  const tailX = s.x - ux * s.len;
  const tailY = s.y - uy * s.len;

  const p = s.life / s.maxLife;
  const alpha = Math.max(0, Math.min(1, p / 0.10) * Math.min(1, (1 - p) / 0.40));
  if (alpha <= 0) return;

  const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
  grad.addColorStop(0.00, `rgba(255,255,255,${0.95 * alpha})`);
  grad.addColorStop(0.20, `rgba(255, 190, 225, ${0.45 * alpha})`);
  grad.addColorStop(0.58, `rgba(255, 138, 200, ${0.12 * alpha})`);
  grad.addColorStop(1.00, 'rgba(255, 138, 200, 0)');

  ctx.strokeStyle = grad;
  ctx.lineWidth = s.width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(tailX, tailY);
  ctx.stroke();

  const headR = s.width * 7;
  const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, headR);
  glow.addColorStop(0.00, `rgba(255,255,255,${0.95 * alpha})`);
  glow.addColorStop(0.35, `rgba(255, 170, 215, ${0.32 * alpha})`);
  glow.addColorStop(1.00, 'rgba(255, 138, 200, 0)');

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(s.x, s.y, headR, 0, Math.PI * 2);
  ctx.fill();
}

function loop(now) {
  ctx.clearRect(0, 0, W, H);

  const t = now * 0.001;
  for (let i = 0; i < stars.length; i++) {
    const st = stars[i];
    const a = st.base + st.amp * Math.sin(t * st.spd + st.phase);
    if (a <= 0) continue;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }

  if (now >= nextSpawn) {
    spawnShooter();
    if (Math.random() < 0.3) spawnShooter();
    nextSpawn = now + 380 + Math.random() * 1000;
  }

  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    drawShooter(s);
    s.x += s.vx;
    s.y += s.vy;
    s.life++;
    if (s.life > s.maxLife || s.x < -520 || s.x > W + 520 || s.y > H + 520) {
      shooters.splice(i, 1);
    }
  }

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

/* =========================================================
   MONACO (optional)
   ========================================================= */
let monacoLoading = false;
const monacoQueue = [];

function defineEncodeTheme() {
  monaco.editor.defineTheme('encode', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: '',                      foreground: 'ededed' },
      { token: 'string',                foreground: 'ffb8d9' },
      { token: 'keyword',               foreground: '8a8a8a' },
      { token: 'identifier',            foreground: 'ffffff' },
      { token: 'delimiter',             foreground: '5f5f5f' },
      { token: 'delimiter.parenthesis', foreground: '6e6e6e' }
    ],
    colors: {
      'editor.background':           '#0a0a0a',
      'editor.foreground':           '#ededed',
      'editorLineNumber.foreground': '#242424',
      'editorCursor.foreground':     '#ffffff',
      'editor.selectionBackground':  '#2a1a22',
      'editor.lineHighlightBackground': '#0a0a0a',
      'editorIndentGuide.background':   '#141414'
    }
  });
}

function createEditor(container) {
  const item = container.closest('.menu-item');
  const key  = item ? item.dataset.script : null;
  const code = SCRIPTS[key] || '';

  monaco.editor.create(container, {
    value: code,
    language: 'lua',
    theme: 'encode',
    readOnly: true,
    domReadOnly: true,
    automaticLayout: true,
    minimap: { enabled: false },
    fontSize: 12,
    fontFamily: "'JetBrains Mono', monospace",
    fontLigatures: true,
    lineNumbers: 'off',
    glyphMargin: false,
    folding: false,
    lineDecorationsWidth: 0,
    lineNumbersMinChars: 0,
    renderLineHighlight: 'none',
    contextmenu: false,
    scrollBeyondLastLine: false,
    overviewRulerLanes: 0,
    overviewRulerBorder: false,
    hideCursorInOverviewRuler: true,
    scrollbar: {
      vertical: 'hidden',
      horizontal: 'hidden',
      handleMouseWheel: false,
      alwaysConsumeMouseWheel: false
    },
    wordWrap: 'on',
    padding: { top: 11, bottom: 11 }
  });

  container.closest('.code-area').classList.add('monaco');
}

function loadMonacoFor(container) {
  if (window.monaco) { createEditor(container); return; }
  monacoQueue.push(container);
  if (monacoLoading) return;
  monacoLoading = true;

  require.config({
    paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }
  });

  require(['vs/editor/editor.main'], () => {
    defineEncodeTheme();
    while (monacoQueue.length) createEditor(monacoQueue.shift());
  });
}

/* =========================================================
   DROPDOWN TOGGLES
   ========================================================= */
document.querySelectorAll('.menu-header').forEach(header => {
  header.addEventListener('click', () => {
    const item = header.closest('.menu-item');
    const isOpen = item.classList.contains('open');

    item.classList.toggle('open');
    header.setAttribute('aria-expanded', String(!isOpen));

    if (!isOpen) {
      const editorEl = item.querySelector('.editor');
      if (editorEl && !editorEl.dataset.loaded) {
        editorEl.dataset.loaded = '1';
        loadMonacoFor(editorEl);
      }
    }
  });
});

/* =========================================================
   COPY — copies exact loadstring only
   ========================================================= */
document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const key = btn.dataset.copy;
    const code = SCRIPTS[key] || '';

    let ok = false;
    try {
      await navigator.clipboard.writeText(code);
      ok = true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    if (!ok) return;

    const label = btn.querySelector('.copy-label');
    btn.classList.add('copied');
    label.textContent = 'Copied';

    clearTimeout(btn._timer);
    btn._timer = setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = 'Copy';
    }, 1400);
  });
});

/* =========================================================
   LOCK IT DOWN
   ========================================================= */
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;

  const blocked =
    e.key === 'F12' ||
    (ctrl && e.shiftKey && ['i', 'j', 'c', 'k', 'e'].includes(k)) ||
    (ctrl && ['u', 's', 'p', 'a'].includes(k));

  if (blocked) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
}, true);

document.addEventListener('selectstart', e => {
  if (!e.target.closest('.code-pre, .monaco-editor, input, textarea')) {
    e.preventDefault();
  }
});
document.addEventListener('dragstart', e => e.preventDefault());
</script>

</body>
</html>
